<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23d97757'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Usage dashboard</a>
    <div class="topbar-right">
      <span id="today-label" class="muted" title="Day boundary used for the Today and 7 days columns"></span>
      <span id="refreshed-at" class="muted">loading…</span>
      <span id="auto-refresh-label" class="muted small" title="The server re-reads sources on this interval (never the paid Brave probe); this tab re-fetches while visible"></span>
      <button id="refresh-button" type="button">Refresh</button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
